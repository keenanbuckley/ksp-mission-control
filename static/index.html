<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KSP Mission Control</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1020; color: #e6e9f2; display: grid; place-items: center; height: 100vh; margin: 0; }
    main { text-align: center; }
    h1 { font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; margin: 0 0 0.5em; font-size: 0.9rem; }
    .ut { font-family: ui-monospace, monospace; font-size: 2.25rem; font-variant-numeric: tabular-nums; }
    .status { margin-top: 0.6em; opacity: 0.5; font-size: 0.8rem; }
    .controls { margin-top: 1.5em; display: flex; gap: 0.5em; justify-content: center; }
    button { font: inherit; background: #1c2745; color: inherit; border: 1px solid #2b3a66; padding: 0.5em 1em; border-radius: 4px; cursor: pointer; }
    button:hover:not(:disabled) { background: #243358; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <h1>Universal Time</h1>
    <div class="ut" id="ut">--</div>
    <div class="status" id="server">connecting...</div>
    <div class="status" id="ksp">KSP: unknown</div>
    <div class="status" id="kos">kOS: unknown</div>
    <div class="status" id="planned"></div>
    <div class="controls">
      <button id="toggle-ag1" disabled>Toggle AG1</button>
      <button id="launch" disabled>Launch</button>
      <button id="plan-circ" disabled>Plan Circ</button>
      <button id="execute-node" disabled>Execute Node</button>
    </div>
  </main>
  <script>
    const utEl = document.getElementById("ut");
    const serverEl = document.getElementById("server");
    const kspEl = document.getElementById("ksp");
    const kosEl = document.getElementById("kos");
    const plannedEl = document.getElementById("planned");
    const toggleAg1Btn = document.getElementById("toggle-ag1");
    const launchBtn = document.getElementById("launch");
    const planCircBtn = document.getElementById("plan-circ");
    const executeNodeBtn = document.getElementById("execute-node");
    const SECS_PER_HOUR = 3600;
    let calendar = null; // populated from status frames: { secs_per_day, secs_per_year }
    function encodeList(items) {
      return { type: "list", data: items };
    }
    function formatUT(ut) {
      const { secs_per_day, secs_per_year } = calendar;
      const years = Math.floor(ut / secs_per_year);
      let r = ut - years * secs_per_year;
      const days = Math.floor(r / secs_per_day); r -= days * secs_per_day;
      const hours = Math.floor(r / SECS_PER_HOUR); r -= hours * SECS_PER_HOUR;
      const minutes = Math.floor(r / 60);
      const seconds = Math.floor(r - minutes * 60);
      return `Year ${years + 1}, Day ${days + 1} - ${hours}h, ${minutes}m, ${seconds}s`;
    }
    const INITIAL_BACKOFF_MS = 500;
    const MAX_BACKOFF_MS = 10000;
    let backoffMs = INITIAL_BACKOFF_MS;
    let activeWs = null;
    // Every command goes through the kOS dispatcher, so the buttons follow
    // the kOS link rather than the kRPC connection alone.
    function setCommandsEnabled(enabled) {
      toggleAg1Btn.disabled = !enabled;
      launchBtn.disabled = !enabled;
      planCircBtn.disabled = !enabled;
      executeNodeBtn.disabled = !enabled;
    }
    function kosText(kos) {
      if (!kos.up) return "kOS: no heartbeat (dispatcher not running, or kOS scripts need redeploying)";
      return kos.running ? `kOS: running ${kos.running}` : "kOS: ready";
    }
    toggleAg1Btn.addEventListener("click", () => {
      if (!activeWs || activeWs.readyState !== WebSocket.OPEN) return;
      activeWs.send(JSON.stringify({ kind: "command", command: { op: "toggle_ag", n: 1 } }));
    });
    launchBtn.addEventListener("click", () => {
      if (!activeWs || activeWs.readyState !== WebSocket.OPEN) return;
      // User-facing mission params. The server pre-computes the derived
      // constants (terrainMax, vMin, altPhase2Entry, terminalPitch) and folds
      // them into the config Lexicon before dispatching to kOS.
      activeWs.send(JSON.stringify({
        kind: "command",
        command: {
          op: "run_script",
          path: "launch.ks",
          args: {
            finalAltitude: 80000,
            targetInclination: 0,
            targetLan: -1,
            qMax: 20,
            qAuth: 0.7,
            qHigh: 20,
            aMaxHigh: 15,
            aMaxLow: 2,
            initialProfilePitch: 80,
            tApTarget: 30,
            throttleMin: 0.1,
            circularize: true,
          },
        },
      }));
    });
    planCircBtn.addEventListener("click", () => {
      if (!activeWs || activeWs.readyState !== WebSocket.OPEN) return;
      activeWs.send(JSON.stringify({ kind: "command", command: { op: "plan_circ" } }));
    });
    executeNodeBtn.addEventListener("click", () => {
      if (!activeWs || activeWs.readyState !== WebSocket.OPEN) return;
      activeWs.send(JSON.stringify({
        kind: "command",
        command: {
          op: "run_script",
          path: "maneuver.ks",
          args: encodeList([]),
        },
      }));
    });
    function connect() {
      serverEl.textContent = "connecting...";
      const wsScheme = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${wsScheme}//${location.host}/ws`);
      activeWs = ws;
      ws.onopen = () => {
        backoffMs = INITIAL_BACKOFF_MS;
        serverEl.textContent = "connected";
      };
      ws.onclose = () => {
        serverEl.textContent = `disconnected, retrying in ${backoffMs / 1000}s`;
        kspEl.textContent = "KSP: unknown";
        kosEl.textContent = "kOS: unknown";
        setCommandsEnabled(false);
        setTimeout(connect, backoffMs);
        backoffMs = Math.min(backoffMs * 2, MAX_BACKOFF_MS);
      };
      ws.onmessage = (ev) => {
        const frame = JSON.parse(ev.data);
        if (frame.kind === "status") {
          if (frame.connected) {
            calendar = frame.calendar;
            kspEl.textContent = "KSP: connected";
            kosEl.textContent = kosText(frame.kos);
            setCommandsEnabled(frame.kos.up);
          } else {
            kspEl.textContent = "KSP: not connected";
            kosEl.textContent = "kOS: unknown";
            setCommandsEnabled(false);
          }
        } else if (frame.kind === "ut" && calendar) {
          utEl.textContent = formatUT(frame.value);
        } else if (frame.kind === "node_planned" && calendar) {
          const { dv, ut } = frame.value;
          plannedEl.textContent = `Planned: dv=${dv.toFixed(2)} m/s at ${formatUT(ut)}`;
        } else if (frame.kind === "command_ack") {
          console.log("command_ack", frame.value);
        } else if (frame.kind === "command_error") {
          console.warn("command_error", frame.value);
          if (frame.value.op === "plan_circ") {
            plannedEl.textContent = "";
          }
        } else if (frame.kind === "script_done") {
          console.log("script_done", frame.value);
        }
      };
    }
    connect();
  </script>
</body>
</html>
