<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KSP Mission Control</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1020; color: #e6e9f2; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { text-align: center; }
    h1 { font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; margin: 0 0 0.5em; font-size: 0.9rem; }
    .ut { font-family: ui-monospace, monospace; font-size: 2.25rem; font-variant-numeric: tabular-nums; }
    .status { margin-top: 0.6em; opacity: 0.5; font-size: 0.8rem; }
    .controls { margin-top: 1.5em; display: flex; gap: 0.5em; justify-content: center; }
    button { font: inherit; background: #1c2745; color: inherit; border: 1px solid #2b3a66; padding: 0.5em 1em; border-radius: 4px; cursor: pointer; }
    button:hover:not(:disabled) { background: #243358; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .error { color: #ff8a8a; opacity: 0.9; }
    form { margin-top: 1.5em; font-size: 0.85rem; text-align: left; }
    .params { display: grid; grid-template-columns: auto 8em; gap: 0.35em 0.75em; align-items: center; }
    details { margin-top: 0.75em; }
    summary { cursor: pointer; opacity: 0.7; margin-bottom: 0.5em; }
    input[type="number"] { font: inherit; font-variant-numeric: tabular-nums; background: #111a33; color: inherit; border: 1px solid #2b3a66; border-radius: 4px; padding: 0.2em 0.4em; width: 100%; box-sizing: border-box; }
    input[type="number"]:invalid { border-color: #ff8a8a; }
    input[type="checkbox"] { justify-self: start; }
  </style>
</head>
<body>
  <main>
    <h1>Universal Time</h1>
    <div class="ut" id="ut">--</div>
    <div class="status" id="server">connecting...</div>
    <div class="status" id="ksp">KSP: unknown</div>
    <div class="status" id="kos">kOS: unknown</div>
    <div class="status" id="planned"></div>
    <div class="status error" id="error"></div>
    <form id="launch-form">
      <div class="params">
        <label for="p-finalAltitude" title="Target apoapsis. Must be above the atmosphere (Kerbin: > 70 km). Reasonable: 75000 to 250000.">Target altitude (m)</label>
        <input id="p-finalAltitude" name="finalAltitude" type="number" step="any" min="0" />
        <label for="p-targetInclination" title="Target orbital inclination. 0 is equatorial; clamped if unreachable from the launch latitude.">Target inclination (deg)</label>
        <input id="p-targetInclination" name="targetInclination" type="number" step="any" min="0" max="180" />
        <label for="p-targetLan" title="Longitude of ascending node to time the launch to. Negative launches immediately.">Longitude of ascending node (deg, -1 = launch now)</label>
        <input id="p-targetLan" name="targetLan" type="number" step="any" min="-1" max="360" />
        <label for="p-qMax" title="Dynamic-pressure ceiling. Lower is gentler on the airframe; higher is more aggressive. Reasonable: 15 to 45.">Max dynamic pressure (kPa)</label>
        <input id="p-qMax" name="qMax" type="number" step="any" min="0" />
        <label for="p-circularize" title="Plan and fly a circularization burn at apoapsis after the ascent.">Circularize at apoapsis</label>
        <input id="p-circularize" name="circularize" type="checkbox" />
      </div>
      <details>
        <summary>Advanced ascent settings</summary>
        <div class="params">
          <label for="p-qAuth" title="Aerodynamic-authority floor that sets the phase-0 airspeed gate. Reasonable: 0.4 to 1.5.">Aerodynamic authority pressure (kPa)</label>
          <input id="p-qAuth" name="qAuth" type="number" step="any" min="0" />
          <label for="p-qHigh" title="Dynamic pressure at which the AoA budget reaches its floor. Usually equal to the max dynamic pressure.">Pressure for minimum angle-of-attack limit (kPa)</label>
          <input id="p-qHigh" name="qHigh" type="number" step="any" min="0" />
          <label for="p-aMaxHigh" title="Maximum angle of attack at low q. Reasonable: 5 to 20.">Max angle of attack at low pressure (deg)</label>
          <input id="p-aMaxHigh" name="aMaxHigh" type="number" step="any" min="0" max="90" />
          <label for="p-aMaxLow" title="Minimum angle of attack near the minimum-limit pressure. Reasonable: 1 to 4.">Max angle of attack at high pressure (deg)</label>
          <input id="p-aMaxLow" name="aMaxLow" type="number" step="any" min="0" max="90" />
          <label for="p-initialProfilePitch" title="Pitch above the horizon the phase-1 profile starts at. Lower turns sooner. Reasonable: 78 to 88.">Initial pitch above horizon (deg)</label>
          <input id="p-initialProfilePitch" name="initialProfilePitch" type="number" step="any" min="0" max="90" />
          <label for="p-tApTarget" title="Time-to-apoapsis floor held in phase 2. Raise it for a marginal upper stage. Reasonable: 20 to 60.">Minimum time to apoapsis (s)</label>
          <input id="p-tApTarget" name="tApTarget" type="number" step="any" min="0" />
          <label for="p-throttleMin" title="Throttle floor for the dynamic-pressure controller. Reasonable: 0.05 to 0.25.">Minimum throttle (0 to 1)</label>
          <input id="p-throttleMin" name="throttleMin" type="number" step="any" min="0" max="1" />
        </div>
      </details>
    </form>
    <div class="controls">
      <button id="toggle-ag1" disabled>Toggle AG1</button>
      <button id="launch" type="submit" form="launch-form" disabled>Launch</button>
      <button id="plan-circ" disabled>Plan Circ</button>
      <button id="execute-node" disabled>Execute Node</button>
    </div>
  </main>
  <script>
    const utEl = document.getElementById("ut");
    const serverEl = document.getElementById("server");
    const kspEl = document.getElementById("ksp");
    const kosEl = document.getElementById("kos");
    const plannedEl = document.getElementById("planned");
    const errorEl = document.getElementById("error");
    const launchForm = document.getElementById("launch-form");
    const toggleAg1Btn = document.getElementById("toggle-ag1");
    const launchBtn = document.getElementById("launch");
    const planCircBtn = document.getElementById("plan-circ");
    const executeNodeBtn = document.getElementById("execute-node");
    const SECS_PER_HOUR = 3600;
    let calendar = null; // populated from status frames: { secs_per_day, secs_per_year }
    function encodeList(items) {
      return { type: "list", data: items };
    }
    function formatUT(ut) {
      const { secs_per_day, secs_per_year } = calendar;
      const years = Math.floor(ut / secs_per_year);
      let r = ut - years * secs_per_year;
      const days = Math.floor(r / secs_per_day); r -= days * secs_per_day;
      const hours = Math.floor(r / SECS_PER_HOUR); r -= hours * SECS_PER_HOUR;
      const minutes = Math.floor(r / 60);
      const seconds = Math.floor(r - minutes * 60);
      return `Year ${years + 1}, Day ${days + 1} - ${hours}h, ${minutes}m, ${seconds}s`;
    }
    const INITIAL_BACKOFF_MS = 500;
    const MAX_BACKOFF_MS = 10000;
    let backoffMs = INITIAL_BACKOFF_MS;
    let activeWs = null;
    let formFilled = false;
    let lastKos = null;
    // Set between sending a launch or node command and the server confirming
    // it (a heartbeat naming the script, a planned node, or an error), which
    // covers the planning round-trips before kos.running can report it.
    let pending = false;
    // Every command goes through the kOS dispatcher, so the buttons follow
    // the kOS link rather than the kRPC connection alone. While a script runs
    // the dispatcher is blocked in it, so a launch or node command would run
    // afterwards against a vessel that has moved on. Action groups are
    // harmless to delay and stay enabled.
    function setCommands(kos) {
      lastKos = kos;
      const up = Boolean(kos && kos.up);
      const idle = up && !kos.running && !pending;
      toggleAg1Btn.disabled = !up;
      launchBtn.disabled = !idle;
      planCircBtn.disabled = !idle;
      executeNodeBtn.disabled = !idle;
    }
    function sendCommand(command, { hold = false } = {}) {
      if (!activeWs || activeWs.readyState !== WebSocket.OPEN) return;
      errorEl.textContent = "";
      activeWs.send(JSON.stringify({ kind: "command", command }));
      if (hold) {
        pending = true;
        setCommands(lastKos);
      }
    }
    function releaseCommands() {
      pending = false;
      setCommands(lastKos);
    }
    function fillLaunchForm(defaults) {
      for (const el of launchForm.elements) {
        if (!el.name || !(el.name in defaults)) continue;
        if (el.type === "checkbox") el.checked = defaults[el.name];
        else el.value = defaults[el.name];
      }
      formFilled = true;
    }
    // Empty fields are left out so the server's defaults apply to them.
    function readLaunchForm() {
      const args = {};
      for (const el of launchForm.elements) {
        if (!el.name) continue;
        if (el.type === "checkbox") args[el.name] = el.checked;
        else if (!Number.isNaN(el.valueAsNumber)) args[el.name] = el.valueAsNumber;
      }
      return args;
    }
    function kosText(kos) {
      if (!kos.up) return "kOS: no heartbeat (dispatcher not running, or kOS scripts need redeploying)";
      return kos.running ? `kOS: running ${kos.running}` : "kOS: ready";
    }
    toggleAg1Btn.addEventListener("click", () => {
      sendCommand({ op: "toggle_ag", n: 1 });
    });
    launchForm.addEventListener("submit", (ev) => {
      ev.preventDefault();
      // The server pre-computes the derived constants (terrainMax, vMin,
      // altPhase2Entry, terminalPitch) and folds them into the config Lexicon
      // before dispatching to kOS.
      sendCommand({ op: "run_script", path: "launch.ks", args: readLaunchForm() }, { hold: true });
    });
    planCircBtn.addEventListener("click", () => {
      sendCommand({ op: "plan_circ" }, { hold: true });
    });
    executeNodeBtn.addEventListener("click", () => {
      sendCommand({ op: "run_script", path: "maneuver.ks", args: encodeList([]) }, { hold: true });
    });
    function connect() {
      serverEl.textContent = "connecting...";
      const wsScheme = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${wsScheme}//${location.host}/ws`);
      activeWs = ws;
      ws.onopen = () => {
        backoffMs = INITIAL_BACKOFF_MS;
        serverEl.textContent = "connected";
      };
      ws.onclose = () => {
        serverEl.textContent = `disconnected, retrying in ${backoffMs / 1000}s`;
        kspEl.textContent = "KSP: unknown";
        kosEl.textContent = "kOS: unknown";
        pending = false;
        setCommands(null);
        setTimeout(connect, backoffMs);
        backoffMs = Math.min(backoffMs * 2, MAX_BACKOFF_MS);
      };
      ws.onmessage = (ev) => {
        const frame = JSON.parse(ev.data);
        if (frame.kind === "status") {
          if (frame.connected) {
            calendar = frame.calendar;
            kspEl.textContent = "KSP: connected";
            kosEl.textContent = kosText(frame.kos);
            if (frame.kos.running) pending = false;
            setCommands(frame.kos);
          } else {
            kspEl.textContent = "KSP: not connected";
            kosEl.textContent = "kOS: unknown";
            pending = false;
            setCommands(null);
          }
        } else if (frame.kind === "launch_defaults") {
          if (!formFilled) fillLaunchForm(frame.value);
        } else if (frame.kind === "ut" && calendar) {
          utEl.textContent = formatUT(frame.value);
        } else if (frame.kind === "node_planned" && calendar) {
          const { dv, ut } = frame.value;
          plannedEl.textContent = `Planned: dv=${dv.toFixed(2)} m/s at ${formatUT(ut)}`;
          releaseCommands();
        } else if (frame.kind === "command_ack") {
          console.log("command_ack", frame.value);
        } else if (frame.kind === "command_error") {
          console.warn("command_error", frame.value);
          errorEl.textContent = `${frame.value.op}: ${frame.value.reason}`;
          releaseCommands();
          if (frame.value.op === "plan_circ") {
            plannedEl.textContent = "";
          }
        } else if (frame.kind === "script_done") {
          console.log("script_done", frame.value);
          releaseCommands();
        }
      };
    }
    connect();
  </script>
</body>
</html>
